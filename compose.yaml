services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    ports:
      - "5173:5173"

    volumes:
      - ./apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://api:8080

    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    ports:
      - "8080:8080"

    volumes:
      - ./apps/api:/app/apps/api

    env_file:
      - .env

    environment:
      - API_ADDR=:8080

volumes:
  web_node_modules:
